services:
  site:
    image: q5m/basis-walks:${Q5M_RELEASE:?exact release required}
    build:
      context: ${Q5M_RELEASE_DIR:?immutable release directory required}
      dockerfile: q5m/Dockerfile
      args:
        Q5M_RELEASE: ${Q5M_RELEASE}
    user: "1000:1000"
    init: true
    restart: "no"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # No host port is guessed here. Platform onboarding must supply the binding.
    expose: ["8080"]
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=32m,mode=1777
    healthcheck:
      test: [CMD-SHELL, 'test "$$(wget -qO- http://127.0.0.1:8080/.q5m-release)" = "$$(cat /usr/share/nginx/html/.q5m-release)"']
      interval: 10s
      timeout: 3s
      retries: 6
    cpus: 0.5
    mem_limit: 128m
    pids_limit: 128
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"
    labels:
      io.q5m.app: ${Q5M_APP}
      io.q5m.release: ${Q5M_RELEASE}
